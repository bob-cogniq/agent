[[acceptance]]
id = "AC-1"
description = "POST /auth/login with valid email+password returns JWT access and refresh tokens"
verify_method = "test"
expected = "Response 200 with JSON containing access_token, refresh_token, token_type fields"

[[acceptance]]
id = "AC-2"
description = "POST /auth/login with invalid credentials returns 401"
verify_method = "test"
expected = "Response 401 with error message indicating invalid credentials"

[[acceptance]]
id = "AC-3"
description = "GET /auth/google redirects to Google OAuth authorization URL with state parameter"
verify_method = "test"
expected = "Response 302/307 redirect to accounts.google.com with state, client_id, redirect_uri, scope params"

[[acceptance]]
id = "AC-4"
description = "GET /auth/google/callback with valid code returns JWT tokens and creates/links user account"
verify_method = "test"
expected = "Response 200 with access_token and refresh_token; user record created or linked in DB"

[[acceptance]]
id = "AC-5"
description = "Protected endpoint returns 401 when no token is provided"
verify_method = "test"
expected = "Response 401 with WWW-Authenticate header"

[[acceptance]]
id = "AC-6"
description = "Protected endpoint returns 200 when valid JWT access token is provided in Authorization header"
verify_method = "test"
expected = "Response 200 with authenticated user data accessible"

[[acceptance]]
id = "AC-7"
description = "Protected endpoint returns 401 when expired or tampered JWT is provided"
verify_method = "test"
expected = "Response 401 with token validation error"

[[acceptance]]
id = "AC-8"
description = "POST /auth/forgot-password with valid email triggers password reset email"
verify_method = "test"
expected = "Response 200; email sent (captured by test mock) containing a reset link with a one-time token"

[[acceptance]]
id = "AC-9"
description = "POST /auth/reset-password with valid token and new password updates password and invalidates token"
verify_method = "test"
expected = "Response 200; subsequent login with new password succeeds; reusing same reset token returns 400/410"

[[acceptance]]
id = "AC-10"
description = "POST /auth/reset-password with expired reset token returns 400/410"
verify_method = "test"
expected = "Response 400 or 410 indicating token is invalid or expired"

[[acceptance]]
id = "AC-11"
description = "auth/oauth.py file exists implementing Google OAuth flow"
verify_method = "existence"
expected = "File src/cogniq/auth/oauth.py exists with Google redirect and callback handler functions"

[[acceptance]]
id = "AC-12"
description = "auth/email_service.py file exists implementing password reset email sending"
verify_method = "existence"
expected = "File src/cogniq/auth/email_service.py exists with send_reset_email function"

[[safety]]
id = "SEC-1"
description = "Passwords are stored using bcrypt or argon2 — never plaintext or reversible encoding"
verify_method = "test"
expected = "User record in DB has hashed password field; hash starts with $2b$ (bcrypt) or $argon2 prefix"

[[safety]]
id = "SEC-2"
description = "JWT secret key is loaded from environment variable, not hardcoded in source"
verify_method = "test"
expected = "config.py reads JWT_SECRET_KEY from env; running with a changed env value produces tokens signed with that key"

[[safety]]
id = "SEC-3"
description = "Google OAuth client_secret is never present in source code; loaded from environment variable"
verify_method = "test"
expected = "Grep of codebase finds no literal client_secret value; config loads GOOGLE_CLIENT_SECRET from env"

[[safety]]
id = "SEC-4"
description = "Password reset token is single-use and has a defined expiry (e.g., 1 hour)"
verify_method = "test"
expected = "After first successful use, reusing token returns 400/410; token older than expiry window returns 400/410"

[[safety]]
id = "SEC-5"
description = "Google OAuth flow uses and validates state parameter to prevent CSRF"
verify_method = "test"
expected = "Callback request with missing or mismatched state param returns 400/403"
