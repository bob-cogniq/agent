[project]
name = "cogniq-shared"
version = "0.1.0"
description = "Shared domain models, DB, and task queue for cogniq"
requires-python = ">=3.12"
dependencies = [
    "motor>=3.6.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.0",
    "tomli-w>=1.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cogniq_shared"]
