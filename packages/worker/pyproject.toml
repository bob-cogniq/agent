[project]
name = "cogniq-worker"
version = "0.1.0"
description = "cogniq agent worker — runs Plan/Build agents"
requires-python = ">=3.12"
dependencies = [
    "cogniq-shared",
    "anthropic>=0.40.0",
    "claude-code-sdk>=0.0.25",
    "tomli-w>=1.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cogniq_worker"]
