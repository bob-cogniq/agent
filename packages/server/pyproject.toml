[project]
name = "cogniq-server"
version = "0.1.0"
description = "cogniq API server — orchestration, auth, REST API"
requires-python = ">=3.12"
dependencies = [
    "cogniq-shared",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pyjwt>=2.9.0",
    "bcrypt>=4.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cogniq_server"]
