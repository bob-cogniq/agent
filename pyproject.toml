[project]
name = "cogniq"
version = "0.1.0"
description = "AI-powered software development automation platform"
requires-python = ">=3.12"
dependencies = [
    "cogniq-shared",
    "cogniq-server",
    "cogniq-worker",
    # Dev tools
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
cogniq-shared = { workspace = true }
cogniq-server = { workspace = true }
cogniq-worker = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
src = ["packages/shared/src", "packages/server/src", "packages/worker/src"]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
